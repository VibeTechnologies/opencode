name: Build and Release

on:
  push:
    branches: [dev]
    paths:
      - 'packages/opencode/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      
      - name: Install dependencies
        run: |
          bun install
          cd packages/opencode && bun install
      
      - name: Build for linux-x64
        run: |
          cd packages/opencode
          bun run build --single
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-linux-x64
          path: packages/opencode/dist/opencode-linux-x64/bin/opencode

  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      
      - name: Install dependencies
        run: |
          bun install
          cd packages/opencode && bun install
      
      - name: Build for linux-arm64
        run: |
          cd packages/opencode
          bun run build --single
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-linux-arm64
          path: packages/opencode/dist/opencode-linux-arm64/bin/opencode

  release:
    needs: [build-linux-x64, build-linux-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Prepare release files
        run: |
          mkdir -p release
          cp artifacts/opencode-linux-x64/opencode release/opencode-linux-x64
          cp artifacts/opencode-linux-arm64/opencode release/opencode-linux-arm64
          chmod +x release/*
          ls -la release/
      
      - name: Delete existing release
        run: gh release delete latest --yes || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build with Context Overflow Fix
          draft: false
          prerelease: false
          files: release/*
          body: |
            Automated build from dev branch with context overflow fix.
            
            **Includes fix from [PR #6234](https://github.com/sst/opencode/pull/6234):**
            - File persistence for large tool outputs (>30k chars)
            - Prevents "prompt is too long" errors
            - WebFetch, Bash, MCP tools save large outputs to disk
            
            ## Download
            - `opencode-linux-x64` - For x86_64 Linux
            - `opencode-linux-arm64` - For ARM64 Linux (e.g., AWS Graviton)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
